<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="color-scheme" content="dark" />
  {% if refresh_seconds %}
  <meta http-equiv="refresh" content="{{ refresh_seconds }}" />
  {% endif %}
  <title>{% block title %}Goal xG{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>
  <header class="top">
    <a class="brand" href="/" aria-label="Goal xG — home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-text">
        <span class="brand-word">Goal</span>
        <span class="brand-xg">xG</span>
      </span>
    </a>
    <nav class="top-nav" aria-label="Sezioni">
      <a class="top-nav-link{% if nav_active == 'board' %} is-active{% endif %}" href="/">Board</a>
      <a class="top-nav-link{% if nav_active == 'odds' %} is-active{% endif %}" href="/odds">Quote</a>
    </nav>
    <p class="tag" title="Over 0.5 · Big-5 · 28–32′">
      <span class="tag-full">Over 0.5 · Big-5 · 28–32′</span>
      <span class="tag-short">O0.5 · 28–32′</span>
    </p>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Key GOAL solo server-side · Indice prodotto 0–100 (non xG Opta)</p>
  </footer>
</body>
</html>
