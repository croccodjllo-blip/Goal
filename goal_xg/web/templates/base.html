<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% if refresh_seconds %}
  <meta http-equiv="refresh" content="{{ refresh_seconds }}" />
  {% endif %}
  <title>{% block title %}Goal xG{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Goal<span>xG</span></a>
    <p class="tag">Over 0.5 · Big-5 · snapshot 0-0 @ 30′</p>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Key GOAL solo server-side · Indice prodotto 0–100 (non xG Opta)</p>
  </footer>
</body>
</html>
