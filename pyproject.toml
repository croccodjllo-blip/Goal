[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-xg"
version = "0.4.5"
description = "Over 0.5 FT product-xG (0–100) Big-5: GOAL REST+WS + API-Sports enrich + FastAPI live UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["websockets>=12.0"]

[project.scripts]
goal-xg = "goal_xg.cli:app"
goal-xg-web = "goal_xg.web.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["goal_xg*"]

[tool.setuptools.package-data]
goal_xg = [
  "web/templates/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
